# PostgreSQL Configuration (Managed by Render Environment Variables)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port and Address
server.port=${PORT:8080}
server.address=0.0.0.0

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=none

# Show SQL statements in logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL script execution at startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Swagger UI Configuration (Using SpringDoc, not SpringFox)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Testcontainers Configuration
testcontainers.wait.timeout=30000

# Logging Configuration
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.web=INFO
